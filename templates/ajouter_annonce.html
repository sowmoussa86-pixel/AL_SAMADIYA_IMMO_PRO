{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4 text-center">
        Déposer une annonce immobilière
    </h2>

    <form action="/ajouter-annonce"
          method="post"
          enctype="multipart/form-data">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Titre</label>
                <input type="text"
                       name="titre"
                       class="form-control"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Catégorie</label>
                <select name="categorie" class="form-control">
                    <option>Maison</option>
                    <option>Appartement</option>
                    <option>Villa</option>
                    <option>Terrain</option>
                    <option>Local commercial</option>
                    <option>Bureau</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Type de transaction</label>
                <select name="type_transaction" class="form-control">
                    <option>Vente</option>
                    <option>Location</option>
                    <option>Location saisonnière</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Prix (FCFA)</label>
                <input
    type="number"
    name="prix"
    class="form-control"
    required>
            </div>

            <div class="col-md-6 mb-3">
                <label>Superficie (m²)</label>
                <input type="number"
                       step="0.01"
                       name="superficie"
                       class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Nombre de chambres</label>
                <input type="number"
                       name="nombre_chambres"
                       class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Nombre de salles de bain</label>
                <input type="number"
                       name="nombre_salles_bain"
                       class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Meublé</label>
                <select name="meuble" class="form-control">
                    <option value="False">Non</option>
                    <option value="True">Oui</option>
                </select>
            </div>

            <div class="col-md-4 mb-3">
                <label>Région</label>
                <input type="text"
                       name="region"
                       class="form-control">
            </div>

            <div class="col-md-4 mb-3">
                <label>Ville</label>
                <input type="text"
                       name="ville"
                       class="form-control">
            </div>

            <div class="col-md-4 mb-3">
                <label>Quartier</label>
                <input type="text"
                       name="quartier"
                       class="form-control">
            </div>

            <div class="col-12 mb-3">
                <label>Adresse</label>
                <input type="text"
                       name="adresse"
                       class="form-control">
            </div>

            <div class="col-md-4 mb-3">
                <label>Téléphone</label>
                <input type="text"
                       name="telephone"
                       class="form-control">
            </div>

            <div class="col-md-4 mb-3">
                <label>WhatsApp</label>
                <input type="text"
                       name="whatsapp"
                       class="form-control">
            </div>

            <div class="col-md-4 mb-3">
                <label>Email</label>
                <input type="email"
                       name="email"
                       class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Latitude</label>
                <input type="text"
                       name="latitude"
                       class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label>Longitude</label>
                <input type="text"
                       name="longitude"
                       class="form-control">
            </div>

            <div class="col-12 mb-3">
                <label>Description</label>

                <textarea
                    name="description"
                    rows="6"
                    class="form-control"></textarea>
            </div>

            <div class="col-12 mb-4">
                <label>Photo principale</label>

                <input
                    type="file"
                    name="image"
                    class="form-control">
            </div>

        </div>

        <button class="btn btn-primary btn-lg w-100">

            Publier mon annonce

        </button>

    </form>

</div>

{% endblock %}
